<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Shiny Hunter</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background-color: #111;
            color: white;
            margin: 0;
            padding: 20px;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 10px;
        }

        #reset-count {
            font-size: 50px;
            font-weight: bold;
        }

        #encounter {
            margin-top: 25px;
            max-width: 100%;
            width: 900px;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Shiny Hunter</h1>

    <div>
        Resets:
        <span id="reset-count">--</span>
    </div>

    <img
        id="encounter"
        src="/static/last_encounter.jpg"
        alt="Last Encounter"
    >

    <script>
        async function updatePage() {
            try {
                // Get reset count
                const response = await fetch("/status");
                const state = await response.json();

                document.getElementById("reset-count").textContent =
                    state.reset_count;

                // Refresh encounter image
                document.getElementById("encounter").src =
                    "/static/last_encounter.jpg?t=" + Date.now();

            } catch (error) {
                console.error("Failed to update:", error);
            }
        }

        // Update immediately when page loads
        updatePage();

        // Then update every 2 seconds
        setInterval(updatePage, 2000);
    </script>

</body>
</html>
